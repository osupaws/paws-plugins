<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>DB Test Plugin</title>

		<!-- These links provide the theme. They will be updated by paws-frontend-api.js -->
		<link rel="stylesheet" href="paws-app://paws-theme-base.css" />
		<link id="paws-theme-base-link" rel="stylesheet" href="" />
		<link id="paws-theme-custom-link" rel="stylesheet" href="" />

		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<h1>Database Test</h1>
		<p>Click the buttons to test the database for the currently selected client mode.</p>

		<div class="test-section">
			<h3>Stable Tests</h3>
			<button id="stable-db-btn" class="paws-button primary">Read osu!.db</button>
			<button id="stable-scores-btn" class="paws-button primary">Read scores.db</button>
			<button id="stable-parse-btn" class="paws-button secondary">Parse Random .osu</button>
			<button id="stable-scan-btn" class="paws-button secondary">Scan Assets (Random Map)</button>
		</div>

		<div class="test-section">
			<h3>Lazer Tests</h3>
			<button id="lazer-sets-btn" class="paws-button primary">Read BeatmapSets</button>
			<button id="lazer-files-btn" class="paws-button secondary">Read Realm Files</button>
		</div>

		<div id="result" class="log-output">Waiting for command...</div>

		<script src="paws-app://paws-frontend-api.js"></script>
		<script src="test-logic.js"></script>
	</body>
</html>
